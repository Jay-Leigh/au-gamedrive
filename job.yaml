apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  annotations:
    run.googleapis.com/creator: jay-leigh.v@conversionscience.co.za
    run.googleapis.com/lastModifier: jay-leigh.v@conversionscience.co.za
  labels:
    cloud.googleapis.com/location: africa-south1
    run.googleapis.com/lastUpdatedTime: '2026-08-05T12:37:31.778435Z'
    run.googleapis.com/satisfiesPzs: 'true'
  name: audience-sync-migration-job
  namespace: '765409358201'
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/client-name: gcloud
        run.googleapis.com/client-version: 574.0.0
        run.googleapis.com/cloudsql-instances: automation-269209:africa-south1:cs-internal-test-db
        run.googleapis.com/execution-environment: gen2
      labels:
        client.knative.dev/nonce: bat_ked_nor
    spec:
      taskCount: 1
      template:
        spec:
          containers:
          - args:
            - alembic upgrade head
            command:
            - sh
            - -c
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: universal_signal_gateway_db_url
            - name: GOOGLE_ADS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: GOOGLE_ADS_CLIENT_ID
            - name: GOOGLE_ADS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: GOOGLE_ADS_AUDIENCE_SECRET
            - name: GOOGLE_ADS_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: GOOGLE_ADS_AUDIENCE_REFRESH_TOKEN
            - name: GOOGLE_ADS_LOGIN_CUSTOMER_ID
              value: "4634083036"
            - name: GOOGLE_ADS_CUSTOMER_ID
              value: "7092652546"
            image: africa-south1-docker.pkg.dev/automation-269209/audience-sync-repo/audience-sync-api:latest
            resources:
              limits:
                cpu: 1000m
                memory: 512Mi
          maxRetries: 0
          serviceAccountName: 765409358201-compute@developer.gserviceaccount.com
          timeoutSeconds: '600'
