apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: audience-sync-api
spec:
  template:
    metadata:
      labels:
          team: "conversion-science"
          app: "audience-sync-api"
          # client_id: CS
          # project/service_id:
          # product: audience_uploader
          # client: audience_uploader
          autoscaling.knative.dev/minScale: "0"
          autoscaling.knative.dev/maxScale: "1"
          run.googleapis.com/cloudsql-instances: "automation-269209:africa-south1:cs-internal-test-db"
    spec:
      template:
    metadata:
      labels:
        team: "conversion-science"
        app: "audience-sync-api"
        image: africa-south1-docker.pkg.dev/automation-269209/audience-sync-repo/audience-sync-api # project id to be confirmed
        ports:
            - containerPort: 8000
        env:
            - name: SYSTEM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: SYSTEM_TOKEN
                  key: 'latest'
            - name: META_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: META_ACCESS_TOKEN
                  key: 'latest'
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: universal_signal_gateway_db
                  key: latest