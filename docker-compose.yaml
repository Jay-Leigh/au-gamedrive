services:
  app:
    build: .
    ports:
      - "8000:8080"
    env_file:
      - .env
    volumes:
      - ./storage_bucket:/app/storage_bucket

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpasos
      POSTGRES_DB: audience_uploader_test
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10
